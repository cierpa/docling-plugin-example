version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/docling-main"
      - "/docling-plugin"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
